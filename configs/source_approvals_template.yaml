version: "1.0.0"

# Copy this file outside the frozen package and add only reviewed assigned
# quarters. A local hash alone is not publisher authentication. Use
# authenticity_status: unverified to authorize cleaning while retaining
# requires_review. The two approved authenticity values require documented
# evidence and all three review booleans.
approvals: {}

