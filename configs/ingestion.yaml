      status: "approved"
      canonical_source_url: "https://f001.backblazeb2.com/file/Backblaze-Hard-Drive-Data/data_Q1_2016.zip"
      original_filename: "data_Q1_2016.zip"
      # Backblaze publishes only a rounded size and no SHA-256 for this file.
      # These independent authenticity fields therefore remain unavailable.
      expected_bytes: null
      expected_sha256: null
      authenticity_evidence:
        status: "unverified"
      # These values were calculated from the locally downloaded candidate.
