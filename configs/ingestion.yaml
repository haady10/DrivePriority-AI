schema:
  version: "1.1.0"
  missing_value_contract_version: "1.0.0"
  allowed_start_date: "2016-01-01"
  allowed_end_date: "2026-06-30"
  # Empty CSV fields are source-missing. Other tokens are conversion errors.
  missing_tokens:
    - ""

processing:
  # Rows are decoded as text and converted in bounded Arrow batches.
  batch_rows: 32768
  # Canonical Python buffers flush at either the row or estimated-byte limit.
  canonical_batch_bytes: 67108864
  # Exception evidence is flushed independently from canonical source batches.
  exception_batch_rows: 8192
  exception_batch_bytes: 16777216
  parquet_row_group_rows: 32768
  encoding: "utf-8-sig"
  duckdb_memory_limit: "1GB"
  worker_threads: 2
  maximum_archive_members: 2000
  maximum_member_uncompressed_bytes: 2147483648
  maximum_archive_uncompressed_bytes: 68719476736
  maximum_compression_ratio: 200
  minimum_free_space_bytes: 1073741824
  working_space_multiplier: 2.0

parquet:
  compression: "zstd"
  compression_level: 3
  write_statistics: true
  dictionary_encode_strings: true

validation:
  require_dates_within_quarter: true
  preserve_source_duplicates: true
  require_complete_row_accounting: true
  require_nonempty_output: true
  require_checkpoint_integrity: true
  require_source_inventory_review: true
  resolve_final_device_identity: false
  generate_future_labels: false

recovery:
  completed_output_policy: "verify"
  staging_suffix: ".staging"

# Inventory verification distinguishes independently published expectations
# from hashes observed locally after download. A local hash is enforced but
# does not independently authenticate the publisher's bytes.
source_inventory:
  status: "verified"
  provenance_reference: "https://www.backblaze.com/cloud-storage/resources/hard-drive-test-data"
  verified_by: "DrivePriority AI local acceptance tooling"
  verified_at: "2026-11-03T15:25:07Z"
